name: Veille adjudications France

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,7,13,19 * * *'
      timezone: Europe/Paris

permissions:
  contents: write

concurrency:
  group: veille-adjudications-main
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Activer les rythmes de toute la base nationale
        run: python optimise_sources.py
      - name: Reconstruire l’inventaire national des URL
        run: python build_catalogue_urls.py
      - name: Publier le catalogue national des URL
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.csv catalogue_urls.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser le catalogue national des URL [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Installer la lecture PDF et l'OCR français
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra
      - name: Vérifier les filtres et la persistance
        run: python -m unittest -v test_veille test_ameliore
      - name: Restaurer l'historique
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/etat.json
          key: veille-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: veille-v1-
      - name: Collecter et qualifier les fiches
        id: collecte
        shell: bash
        run: |
          set +e
          python veille.py --max-listing-pages 12 --max-profile-pages 2 --max-discovery-pages 1 --max-profile-sources 700 --max-directory-sources 50 --max-discovered-sources 100 --profile-interval-hours 5 --directory-interval-hours 168 --discovered-interval-hours 24 --max-hearings 200 --max-details 800 --max-documents 100 --max-pdf-pages 800 --max-ocr-pages 80
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Résumé du passage
        if: always()
        run: |
          if [ -f rapports/dernier.md ]; then
            cat rapports/dernier.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Le moteur n’a pas produit de rapport.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Signaler les interventions requises avec leurs liens
        if: always() && hashFiles('rapports/dernier.json') != ''
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("rapports/dernier.json").read_text(encoding="utf-8"))
          for item in report.get("interventions", []):
              message = f"{item['probleme']} Action : {item['action']} Lien : {item['url']}"
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::warning title=Intervention requise — {item['source']}::{message}")
          PY
      - name: Conserver le rapport, le catalogue et le référentiel URL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veille-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rapports/
            controle_couverture.csv
            catalogue_urls.csv
            data/catalogue.json
            data/etat.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publier le dernier rapport
        if: success()
        shell: bash
        run: |
          test -f rapports/dernier.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rapports/dernier.md rapports/dernier.json rapports/dernier.csv rapports/sources.csv rapports/interventions.md
          if ! git diff --cached --quiet; then
            git commit -m 'Actualiser le rapport de veille [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Sauvegarder l'historique
        if: always() && hashFiles('data/etat.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/etat.json
          key: veille-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Signaler une collecte partielle
        if: steps.collecte.outputs.exit_code != '0'
        run: |
          if [ '${{ steps.collecte.outputs.exit_code }}' = '2' ]; then
            echo '::warning::Rapport publié avec couverture partielle : consulter les sources et incidents.'
          else
            echo 'Erreur du moteur : consulter le rapport et les journaux.'
            exit 1
          fi
